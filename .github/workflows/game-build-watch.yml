name: game-build-watch

# Opens an issue when SteamTracking/GameTracking-Dota2 has a game build whose files differ from the newest
# data/stats/<v>/ snapshot (a new patch -> tools/new_patch.py; a build without notes -> silent changes).
# Credentials: this workflow's own GITHUB_TOKEN (issues: write) and the read-only deploy key of the private
# game-files store (the newest snapshot's raw files live there). One issue per build.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      DOTA_FILES_DIR: ${{ github.workspace }}/.store/dota-patch-files
    steps:
      - uses: actions/checkout@v7

      - name: Check out the game-files store
        uses: actions/checkout@v7
        with:
          repository: sikleq/dota-patch-files
          ssh-key: ${{ secrets.DOTA_FILES_DEPLOY_KEY }}
          path: .store/dota-patch-files
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Lay out the raw game files from the store
        run: python tools/game_files.py materialize

      - name: Newer game build than the newest snapshot?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python tools/check_game_build.py --open-issue
